name: Laravel package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pliego-laravel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate package
        run: composer --no-interaction --no-plugins --no-scripts validate --strict

      - name: Install public dependencies
        run: composer --no-interaction --no-plugins --no-scripts install --no-progress --prefer-dist

      - name: Run focused package tests
        run: |
          composer --no-interaction --no-plugins test
          php tests/quickstart_test.php

      - name: Bind package manifest to the exact native release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi
          if [[ "$version" == "0.1.1" ]]; then
            echo "v0.1.1 predates the promoted-manifest contract"
            exit 0
          fi
          mkdir native-release
          gh release download "v$version" \
            --repo oxhq/pliego \
            --pattern runtimes.json \
            --dir native-release
          PLIEGO_RELEASE_RUNTIME_MANIFEST="$GITHUB_WORKSPACE/native-release/runtimes.json" \
            composer --no-interaction release:check-runtime
